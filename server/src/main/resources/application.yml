spring:
  application:
    name: bookstore-server

  # ── Gmail SMTP ───────────────────────────────────────────────────────────────
  # Set MAIL_USERNAME and MAIL_PASSWORD as environment variables (or in .env).
  # MAIL_PASSWORD must be a Gmail App Password (not your normal Gmail password).
  # How to create one: Google Account → Security → 2-Step Verification → App passwords
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
        debug: false

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/bookstore}
    username: ${DB_USERNAME:bookstore}
    password: ${DB_PASSWORD:bookstore}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate          # Flyway owns the schema; Hibernate only validates
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: public

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api

# ── JWT ──────────────────────────────────────────────────────────────────────
app:
  jwt:
    secret: ${JWT_SECRET:changeme-use-a-long-random-secret-in-production-min-256bits}
    access-token-expiry-ms: 86400000      # 24 hours (was 15 min — too short for demo)
    refresh-token-expiry-ms: 604800000    # 7 days
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173}
  stripe:
    secret-key: ${STRIPE_SECRET_KEY:sk_test_placeholder}
  mail:
    from: ${MAIL_FROM:${MAIL_USERNAME:noreply@bookhaven.local}}
    base-url: ${APP_BASE_URL:http://localhost:5173}

# ── SpringDoc / Swagger UI ────────────────────────────────────────────────────
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
    display-request-duration: true
  show-actuator: false

# ── Logging ──────────────────────────────────────────────────────────────────
logging:
  level:
    root: INFO
    com.bookstore: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: INFO
